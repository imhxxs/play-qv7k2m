<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-label="연분홍 한복을 입은 선희보살이 오른손을 가슴께로 들어 오방기 다섯 자루를 쥐고 있다. 깃발이 얼굴을 가리고, 깃대를 쥔 오른손 손목에 금팔찌가 보인다.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset=".62" stop-color="#f0dcc9"/>
      <stop offset="1" stop-color="#b48db6"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2bf"/>
      <stop offset=".5" stop-color="#f1cf6b"/>
      <stop offset="1" stop-color="#b48226"/>
    </linearGradient>
    <linearGradient id="jeo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcdbe5"/>
      <stop offset="1" stop-color="#efb5c8"/>
    </linearGradient>
    <linearGradient id="chima" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d77fa8"/>
      <stop offset="1" stop-color="#9a4580"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4b28"/>
      <stop offset=".5" stop-color="#c2895a"/>
      <stop offset="1" stop-color="#6a3f20"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d6c4"/>
      <stop offset="1" stop-color="#e2b9a3"/>
    </linearGradient>
    <g id="flagpole">
      <rect x="111.5" y="40" width="5" height="232" rx="2.5" fill="url(#pole)"/>
      <circle cx="114" cy="38" r="5.5" fill="url(#gold)"/>
    </g>
    <path id="cloth" d="M117 46C142 36 166 56 192 46C206 41 214 44 226 50L222 142C212 136 202 136 192 140C166 150 142 134 117 142Z"/>
  </defs>

  <rect width="360" height="440" fill="url(#bg)"/>
  <!-- 배경 구름 문양 -->
  <g fill="none" stroke="#d9b06a" stroke-opacity=".38" stroke-width="2" stroke-linecap="round">
    <path d="M262 176c8-16 30-16 36 0c12-6 26 6 18 16"/><path d="M274 190c6 6 18 6 24 0"/>
    <path d="M26 92c8-14 28-14 34 0c10-4 22 6 14 14"/><path d="M38 104c6 5 16 5 22 0"/>
    <path d="M290 330c6-12 22-12 28 0c8-4 18 4 12 12"/>
  </g>

  <!-- 머리·얼굴(깃발 뒤) -->
  <path d="M136 84c0-36 22-58 48-58s48 22 48 58c4 40-2 90-10 118h-76c-8-28-14-78-10-118z" fill="#24161f"/>
  <ellipse cx="184" cy="88" rx="34" ry="40" fill="url(#skin)"/>
  <!-- 목 -->
  <path d="M170 120h28v78h-28z" fill="url(#skin)"/>
  <path d="M170 176c9 7 19 7 28 0v22h-28z" fill="#d6a690" opacity=".55"/>

  <!-- 치마 -->
  <path d="M86 300H282C304 350 314 400 320 440H48C54 400 64 350 86 300Z" fill="url(#chima)"/>
  <path d="M120 320c-8 40-12 80-12 120M184 316v124M248 320c8 40 12 80 12 120" stroke="#8a3a72" stroke-width="2" opacity=".35" fill="none"/>
  <!-- 저고리 -->
  <path d="M80 314C86 262 114 226 156 212L184 236L212 212C254 226 282 262 288 314Z" fill="url(#jeo)"/>
  <!-- 깃·동정 -->
  <path d="M156 212l28 50 28-50" fill="none" stroke="#e48aa8" stroke-width="13" stroke-linejoin="round"/>
  <path d="M156 212l28 50 28-50" fill="none" stroke="#fffaf2" stroke-width="5" stroke-linejoin="round"/>
  <!-- 고름 -->
  <circle cx="190" cy="268" r="8" fill="#b93b70"/>
  <path d="M192 270c18 12 28 40 26 82" fill="none" stroke="#b93b70" stroke-width="12" stroke-linecap="round"/>
  <path d="M188 272c-6 24-4 52 6 80" fill="none" stroke="#d2588a" stroke-width="9" stroke-linecap="round"/>

  <!-- 왼팔(사진 오른쪽): 가지런히 내림 -->
  <path d="M244 232C272 248 290 288 294 336L262 346C256 308 246 280 230 260Z" fill="url(#jeo)"/>
  <path d="M260 336l32-8 4 22-32 8z" fill="#fffaf2" stroke="#e48aa8" stroke-width="3"/>
  <path d="M266 356c8 8 22 6 28-2c4 12-4 22-14 22s-16-8-14-20z" fill="url(#skin)"/>

  <!-- 오방기 다섯(오른손이 쥔 자리를 중심으로 부채꼴) -->
  <g stroke="#00000020" stroke-width="1">
    <g transform="rotate(-26 114 210)"><use href="#flagpole"/><use href="#cloth" fill="#c8323a"/></g>
    <g transform="rotate(-13 114 210)"><use href="#flagpole"/><use href="#cloth" fill="#e8b923"/></g>
    <g transform="rotate(0 114 210)"><use href="#flagpole"/><use href="#cloth" fill="#f8f3e7"/></g>
    <g transform="rotate(13 114 210)"><use href="#flagpole"/><use href="#cloth" fill="#2f5fb3"/></g>
    <g transform="rotate(26 114 210)"><use href="#flagpole"/><use href="#cloth" fill="#2f8f4e"/></g>
  </g>

  <!-- 오른팔(사진 왼쪽): 가슴께로 들어 깃대를 쥠 -->
  <path d="M68 324C70 290 84 258 100 238L130 248C118 268 110 294 108 326C96 336 80 336 68 324Z" fill="url(#jeo)"/>
  <path d="M98 236l32 10-4 16-32-10z" fill="#fffaf2" stroke="#e48aa8" stroke-width="3"/>
  <!-- 오른손 -->
  <path d="M98 206c0-10 7-16 16-16s16 6 16 16v14c0 9-7 14-16 14s-16-5-16-14z" fill="url(#skin)"/>
  <path d="M100 202c8-2 20-2 28 1M100 212c8-2 20-2 28 1M100 222c8-2 20-2 28 1" fill="none" stroke="#d29f87" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 오른손목 금팔찌 -->
  <ellipse cx="113" cy="236" rx="17" ry="5.5" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <ellipse cx="113" cy="236" rx="17" ry="5.5" fill="none" stroke="#fff6d6" stroke-width="1.3" stroke-dasharray="3 6" opacity=".9"/>
  <circle cx="99" cy="238" r="2" fill="#fff6d6"/>

  <!-- 액자 테두리 -->
  <rect x="6" y="6" width="348" height="428" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <rect x="16" y="16" width="328" height="408" fill="none" stroke="#f1cf6b" stroke-opacity=".7" stroke-width="1.5"/>
</svg>
