  <!-- 짚과 기왓가루 -->
  <g stroke-linecap="round">
    <g stroke="#d9b765" stroke-width="5"><path d="M120 720 L400 640 M130 730 L410 652 M140 742 L420 664 M126 712 L396 630 M150 748 L424 676"/></g>
    <g stroke="#2a2420" stroke-width="6" opacity=".85"><path d="M360 650 L410 636 M368 662 L418 648 M372 674 L424 662"/></g>
    <path d="M140 712 C200 700 240 760 160 760 Z" fill="#c9a24e"/>
