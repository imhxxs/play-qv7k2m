    <path d="M-50 -30 C-46 20 -20 30 0 30 C20 30 46 20 50 -30 Z" fill="url(#cup)"/>
    <ellipse cy="-30" rx="50" ry="12" fill="#e9c46e"/><ellipse cy="-28" rx="42" ry="8" fill="#a77c32"/>
    <path d="M-34 -10 C-30 10 -18 18 -6 20" fill="none" stroke="#fff6d4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
