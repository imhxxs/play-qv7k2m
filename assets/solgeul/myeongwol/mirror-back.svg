<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>놋거울 뒷면 (2026.08.30, 흐림)</title>
  <!-- 다은 블로그 '놋거울'. 뒷면은 흙이 끼고 사진이 흔들려 새김을 읽을 수 없다(일부러 글자 모양을 그리지 않는다).
       선명한 뒷면 사진은 비밀글(제2장)에 있다. -->
  <defs>
    <radialGradient id="soil" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#6b5440"/><stop offset=".7" stop-color="#4a3a2b"/><stop offset="1" stop-color="#2c2219"/>
    </radialGradient>
    <linearGradient id="hanji" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5d7ba"/><stop offset=".5" stop-color="#d4c29d"/><stop offset="1" stop-color="#bba67e"/>
    </linearGradient>
    <radialGradient id="back" cx="42%" cy="36%" r="80%">
      <stop offset="0" stop-color="#b48a47"/><stop offset=".5" stop-color="#8c6630"/><stop offset="1" stop-color="#4e3612"/>
    </radialGradient>
    <radialGradient id="knob" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#e9c77f"/><stop offset="1" stop-color="#7a5524"/>
    </radialGradient>
    <filter id="shake" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9 4"/></filter>
    <filter id="smear" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16 7"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="21"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .26 0"/>
    </filter>
    <filter id="crumple" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".013 .018" numOctaves="3" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="44"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#soil)"/>
  <rect width="1000" height="1000" filter="url(#grain)"/>
  <g filter="url(#crumple)"><path d="M60 230 L470 60 L940 160 L930 700 L760 960 L240 930 L80 700 Z" fill="url(#hanji)"/></g>
  <ellipse cx="515" cy="530" rx="372" ry="368" fill="#1d140b" opacity=".5" filter="url(#soft)"/>

  <!-- 손이 떨려 흔들린 사진 -->
  <g filter="url(#shake)" transform="translate(500 500)">
    <circle r="356" fill="url(#back)"/>
    <circle r="356" fill="none" stroke="#3f2a0c" stroke-width="18"/>
    <circle r="300" fill="none" stroke="#a37a3a" stroke-width="6" opacity=".7"/>
    <circle r="120" fill="none" stroke="#a37a3a" stroke-width="5" opacity=".6"/>
    <!-- 꼭지와 끈 -->
    <circle r="54" fill="url(#knob)"/>
    <ellipse cx="0" cy="-6" rx="22" ry="12" fill="#3b260c"/>
    <path d="M-20 -6 C-120 -80 -150 -210 -60 -260 C20 -300 90 -230 22 -6" fill="none" stroke="#8a2e24" stroke-width="16" stroke-linecap="round" opacity=".85"/>
    <!-- 흙이 낀 새김 자리(알아볼 수 없음) -->
    <g fill="#4a3216" opacity=".7" filter="url(#smear)">
      <rect x="150" y="-150" width="40" height="120" rx="14"/>
      <rect x="160" y="-10" width="34" height="90" rx="12"/>
      <rect x="215" y="-180" width="30" height="70" rx="10"/>
      <rect x="205" y="-90" width="44" height="160" rx="14"/>
      <rect x="210" y="90" width="32" height="70" rx="10"/>
    </g>
    <g fill="#5d452c" opacity=".75">
      <ellipse cx="190" cy="-60" rx="80" ry="150"/><ellipse cx="-220" cy="160" rx="60" ry="34"/><ellipse cx="-160" cy="-230" rx="40" ry="22"/>
    </g>
  </g>
  <rect width="1000" height="1000" fill="#ffe2b0" opacity=".05"/>
</svg>
