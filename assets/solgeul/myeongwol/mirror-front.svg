<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>놋거울 앞면 (2026.08.30)</title>
  <!-- 다은 블로그 '놋거울'(E12). 창작 일러스트. 지름 36cm 볼록 놋거울: 가운데 지름 40%에 日月·북두칠성 새김(월하당 갤러리 명두와 같은 배치),
       바깥 띠는 민무늬로 반들거린다. 삭은 한지와 흙 위에 놓여 있다. -->
  <defs>
    <radialGradient id="soil" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#6b5440"/><stop offset=".7" stop-color="#4a3a2b"/><stop offset="1" stop-color="#2c2219"/>
    </radialGradient>
    <linearGradient id="hanji" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9dcc0"/><stop offset=".5" stop-color="#d9c8a5"/><stop offset="1" stop-color="#c2ad86"/>
    </linearGradient>
    <radialGradient id="brass" cx="36%" cy="30%" r="82%">
      <stop offset="0" stop-color="#fff2c4"/><stop offset=".18" stop-color="#ecca7c"/><stop offset=".5" stop-color="#c39448"/><stop offset=".8" stop-color="#93682b"/><stop offset="1" stop-color="#5f4116"/>
    </radialGradient>
    <radialGradient id="core" cx="44%" cy="38%" r="72%">
      <stop offset="0" stop-color="#e6c477"/><stop offset="1" stop-color="#b08640"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset=".45" stop-color="#fdf7e2" stop-opacity=".42"/><stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .22 0"/>
    </filter>
    <filter id="crumple" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="40"/>
    </filter>
  </defs>

  <!-- 흙 -->
  <rect width="1000" height="1000" fill="url(#soil)"/>
  <rect width="1000" height="1000" filter="url(#grain)"/>
  <g fill="#2a1f16" opacity=".55">
    <circle cx="80" cy="120" r="14"/><circle cx="930" cy="90" r="10"/><circle cx="905" cy="880" r="18"/><circle cx="70" cy="900" r="12"/>
    <circle cx="140" cy="960" r="7"/><circle cx="960" cy="520" r="9"/><circle cx="40" cy="470" r="8"/>
  </g>

  <!-- 삭은 한지 -->
  <g filter="url(#crumple)">
    <path d="M90 170 L520 70 L930 190 L960 640 L820 940 L330 960 L60 760 Z" fill="url(#hanji)"/>
  </g>
  <g fill="none" stroke="#a8916a" stroke-width="2" opacity=".55">
    <path d="M120 300 C260 330 380 280 520 330"/><path d="M640 120 C660 300 620 420 700 560"/><path d="M200 760 C330 700 420 760 560 720"/>
    <path d="M760 820 C820 700 880 640 930 560"/><path d="M110 520 C180 480 230 560 300 520"/>
  </g>
  <g fill="#8a6c45" opacity=".35">
    <path d="M150 210 l40 -8 l-10 30z"/><path d="M860 260 l30 20 l-36 10z"/><path d="M840 820 l40 -30 l6 36z"/><path d="M120 700 l30 10 l-20 26z"/>
  </g>
  <!-- 그림자 -->
  <ellipse cx="520" cy="530" rx="380" ry="374" fill="#20160c" opacity=".5" filter="url(#soft)"/>

  <!-- 거울 -->
  <g transform="translate(500 500)">
    <circle r="362" fill="url(#brass)"/>
    <circle r="362" fill="none" stroke="#4e3410" stroke-width="16"/>
    <circle r="344" fill="none" stroke="#f9e6ae" stroke-width="3" opacity=".5"/>
    <!-- 민무늬 바깥 띠의 반들거림(하늘이 비친다) -->
    <circle r="330" fill="url(#sky)"/>
    <path d="M-268 -170 A318 318 0 0 1 -40 -316" fill="none" stroke="#fffbe8" stroke-width="34" stroke-linecap="round" opacity=".55" filter="url(#blur)"/>
    <path d="M206 240 A300 300 0 0 1 40 312" fill="none" stroke="#fff3c8" stroke-width="20" stroke-linecap="round" opacity=".35" filter="url(#blur)"/>
    <path d="M286 -150 A324 324 0 0 1 306 110" fill="none" stroke="#6e4c18" stroke-width="26" stroke-linecap="round" opacity=".25" filter="url(#blur)"/>
    <!-- 흙 자국 -->
    <g fill="#5a4330" opacity=".55">
      <ellipse cx="-250" cy="210" rx="34" ry="16" transform="rotate(-30 -250 210)"/><ellipse cx="200" cy="-260" rx="22" ry="10"/>
      <circle cx="270" cy="170" r="8"/><circle cx="-300" cy="-40" r="6"/><circle cx="-120" cy="300" r="9"/>
    </g>
    <!-- 가운데 새김(지름의 40%) -->
    <circle r="146" fill="url(#core)"/>
    <circle r="146" fill="none" stroke="#573812" stroke-width="6"/>
    <circle r="134" fill="none" stroke="#f6dfa0" stroke-width="3" opacity=".75"/>
    <g transform="scale(4.75)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#f6dfa0" stroke-width="1.5" transform="translate(.6 .6)" opacity=".7">
        <path d="M-19 -19 H-9 V-4 H-19 Z M-19 -11.5 H-9"/>
        <path d="M2 -19 V-7 Q2 -3 -1 -2 M2 -19 H12 V-5 Q12 -2 9 -3 M2 -14 H12 M2 -9.5 H12"/>
      </g>
      <g stroke="#3e2509" stroke-width="1.6">
        <path d="M-19 -19 H-9 V-4 H-19 Z M-19 -11.5 H-9"/>
        <path d="M2 -19 V-7 Q2 -3 -1 -2 M2 -19 H12 V-5 Q12 -2 9 -3 M2 -14 H12 M2 -9.5 H12"/>
      </g>
      <path d="M-20 6 L-20 17 L-8 19 L-7 8 Z M-7 8 L3 7 L12 10 L21 16" stroke="#3e2509" stroke-width=".8"/>
      <g fill="#33200a" stroke="none">
        <circle cx="-20" cy="6" r="2"/><circle cx="-20" cy="17" r="2"/><circle cx="-8" cy="19" r="2"/><circle cx="-7" cy="8" r="2"/>
        <circle cx="3" cy="7" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="21" cy="16" r="2"/>
      </g>
    </g>
    <!-- 새김 홈에 낀 흙 -->
    <g fill="#5a4330" opacity=".4"><circle cx="-60" cy="-40" r="5"/><circle cx="40" cy="70" r="4"/><circle cx="90" cy="-20" r="3"/></g>
  </g>

  <!-- 빛 -->
  <rect width="1000" height="1000" fill="#ffd9a0" opacity=".06"/>
</svg>
