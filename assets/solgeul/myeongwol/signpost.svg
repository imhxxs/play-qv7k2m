<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>갈림길 이정표 (2026.09.22)</title>
  <!-- 다은 블로그 '입산'. 창작 일러스트. 위 판자는 왼쪽이 부러져 '…성 기도터 0.8km'에서 잘려 있다(앞 글자는 없다).
       아래 판자는 멀쩡하다: '버스 종점 3.4km'. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2d6cb"/><stop offset=".6" stop-color="#a7af9c"/><stop offset="1" stop-color="#6c7462"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f8466"/><stop offset="1" stop-color="#5d5440"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b59a6c"/><stop offset=".5" stop-color="#9f845a"/><stop offset="1" stop-color="#7f6744"/></linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5e4a31"/><stop offset=".5" stop-color="#806546"/><stop offset="1" stop-color="#4c3b26"/></linearGradient>
    <filter id="mist" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grainw" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="2"/>
      <feColorMatrix values="0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .1  0 0 0 .55 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- 숲 -->
  <g fill="#65705c" opacity=".55" filter="url(#mist)"><path d="M0 330 C200 270 330 320 470 280 C640 230 800 300 960 250 C1080 220 1160 250 1200 240 V560 H0 Z"/></g>
  <g stroke-linecap="round" filter="url(#soft)">
    <path d="M70 0 V600" stroke="#4f5a47" stroke-width="22" opacity=".55"/>
    <path d="M250 0 V560" stroke="#59634f" stroke-width="12" opacity=".45"/>
    <path d="M1080 0 V600" stroke="#4b5543" stroke-width="26" opacity=".55"/>
    <path d="M960 40 V560" stroke="#5e684f" stroke-width="10" opacity=".4"/>
    <path d="M1170 0 V600" stroke="#444d3c" stroke-width="16" opacity=".5"/>
  </g>
  <path d="M0 560 C300 520 520 540 640 520 C760 500 980 540 1200 520 V800 H0 Z" fill="#4d5440"/>
  <!-- 길 -->
  <path d="M420 800 C520 690 600 620 660 540 C690 520 720 520 744 540 C760 600 800 700 900 800 Z" fill="url(#path)"/>
  <g fill="#3e4434" opacity=".7"><ellipse cx="300" cy="700" rx="160" ry="40"/><ellipse cx="1040" cy="720" rx="180" ry="50"/></g>
  <g stroke="#6e7a55" stroke-width="3" opacity=".8">
    <path d="M330 640 l-10 -26 M346 642 l4 -28 M362 646 l12 -22"/><path d="M980 660 l-8 -24 M1000 662 l6 -26"/>
  </g>

  <!-- 이정표 기둥 -->
  <ellipse cx="560" cy="742" rx="70" ry="14" fill="#232619" opacity=".5" filter="url(#soft)"/>
  <rect x="535" y="170" width="46" height="580" fill="url(#post)"/>
  <rect x="535" y="170" width="46" height="580" fill="#000" filter="url(#grainw)" opacity=".35"/>
  <path d="M530 170 L586 170 L578 150 L540 150 Z" fill="#6a5438"/>

  <!-- 위 판자: 왼쪽이 부러졌다 -->
  <g transform="rotate(-3 700 260)">
    <path d="M520 215 L536 226 L512 240 L530 254 L509 268 L527 282 L516 300 L900 300 L956 258 L900 215 Z" fill="url(#wood)"/>
    <path d="M520 215 L536 226 L512 240 L530 254 L509 268 L527 282 L516 300 L900 300 L956 258 L900 215 Z" fill="#000" filter="url(#grainw)" opacity=".4"/>
    <path d="M520 215 L536 226 L512 240 L530 254 L509 268 L527 282 L516 300" fill="none" stroke="#e6d4ae" stroke-width="3" opacity=".8"/>
    <path d="M520 215 H900 L956 258" fill="none" stroke="#5a4528" stroke-width="3" opacity=".5"/>
    <text x="548" y="277" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic','NanumGothic',sans-serif" font-size="50" font-weight="700" fill="#3a2a17" opacity=".86" letter-spacing="2">성 기도터 0.8km</text>
  </g>
  <!-- 판자를 박은 못(기둥 쪽) -->
  <circle cx="558" cy="318" r="5" fill="#3d3020"/><circle cx="558" cy="452" r="5" fill="#3d3020"/>

  <!-- 아래 판자: 멀쩡하다 -->
  <g transform="rotate(2 420 400)">
    <path d="M262 360 L212 400 L262 440 L560 440 L560 360 Z" fill="url(#wood)"/>
    <path d="M262 360 L212 400 L262 440 L560 440 L560 360 Z" fill="#000" filter="url(#grainw)" opacity=".4"/>
    <text x="250" y="414" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic','NanumGothic',sans-serif" font-size="36" font-weight="700" fill="#3a2a17" opacity=".82">버스 종점 3.4km</text>
  </g>
  <!-- 이끼 -->
  <path d="M535 600 C548 580 566 610 581 590 V750 H535 Z" fill="#5f7344" opacity=".7"/>
  <!-- 떨어진 판자 조각(풀 속) -->
  <path d="M700 690 L780 676 L792 700 L708 714 Z" fill="#8e7550" opacity=".6"/>
  <rect width="1200" height="800" fill="#e8ead8" opacity=".07"/>
</svg>
