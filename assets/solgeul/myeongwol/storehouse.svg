<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>창고 문 (2026.09.07)</title>
  <!-- 다은 블로그 '창고 열쇠'. 창작 일러스트. 흙벽, 낡은 나무 문, 놋쇠 자물쇠, 돌계단, 저녁 볕과 감나무 가지 그림자. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b28c"/><stop offset="1" stop-color="#a68d67"/></linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f5a43"/><stop offset=".5" stop-color="#857058"/><stop offset="1" stop-color="#6a553e"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35a" stop-opacity=".45"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></linearGradient>
    <radialGradient id="lock" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#ffe7a6"/><stop offset=".5" stop-color="#c99b45"/><stop offset="1" stop-color="#7c5a22"/></radialGradient>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="12"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .45 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="woodg" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".003 .08" numOctaves="3" seed="6"/>
      <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .1  0 0 0 .6 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect width="1200" height="800" fill="#000" filter="url(#tex)"/>
  <!-- 기둥과 문틀 -->
  <rect x="300" y="40" width="40" height="640" fill="#4d3b28"/><rect x="860" y="40" width="40" height="640" fill="#4d3b28"/>
  <rect x="300" y="40" width="600" height="36" fill="#4a3826"/>
  <!-- 문짝 둘 -->
  <g>
    <rect x="340" y="76" width="260" height="604" fill="url(#plank)"/>
    <rect x="600" y="76" width="260" height="604" fill="url(#plank)"/>
    <rect x="340" y="76" width="520" height="604" fill="#000" filter="url(#woodg)" opacity=".45"/>
    <g stroke="#3e2f20" stroke-width="3" opacity=".7"><path d="M405 76 V680 M470 76 V680 M535 76 V680 M665 76 V680 M730 76 V680 M795 76 V680"/></g>
    <path d="M600 76 V680" stroke="#2c2117" stroke-width="6"/>
    <!-- 띠장 -->
    <rect x="340" y="170" width="520" height="22" fill="#5c4732"/><rect x="340" y="560" width="520" height="22" fill="#5c4732"/>
    <!-- 문고리와 걸쇠 -->
    <rect x="560" y="340" width="80" height="16" rx="3" fill="#3a3a38"/>
    <circle cx="582" cy="348" r="8" fill="#55534e"/><circle cx="618" cy="348" r="8" fill="#55534e"/>
    <!-- 자물쇠 -->
    <path d="M582 352 C582 320 618 320 618 352" fill="none" stroke="#8a8780" stroke-width="7"/>
    <rect x="566" y="352" width="68" height="76" rx="12" fill="url(#lock)"/>
    <rect x="566" y="352" width="68" height="76" rx="12" fill="none" stroke="#6b4c1c" stroke-width="3"/>
    <circle cx="600" cy="384" r="7" fill="#4a3412"/><rect x="597" y="386" width="6" height="20" fill="#4a3412"/>
  </g>
  <!-- 돌계단 -->
  <path d="M260 680 H940 L980 730 H220 Z" fill="#8e877b"/>
  <path d="M220 730 H980 L1010 800 H190 Z" fill="#777164"/>
  <path d="M260 680 H940" stroke="#b2ab9e" stroke-width="3"/>
  <!-- 저녁 볕 -->
  <path d="M0 0 H700 L1200 560 V800 H900 L0 160 Z" fill="url(#sun)"/>
  <!-- 감나무 가지 그림자 -->
  <g fill="none" stroke="#2c2016" stroke-linecap="round" opacity=".28" filter="url(#blur)">
    <path d="M1200 120 C1050 160 960 220 880 300 C840 340 800 360 740 370" stroke-width="18"/>
    <path d="M960 220 C930 170 900 140 860 120" stroke-width="10"/>
    <path d="M880 300 C900 360 940 400 1000 420" stroke-width="9"/>
  </g>
  <g fill="#2c2016" opacity=".22" filter="url(#blur)"><ellipse cx="860" cy="120" rx="30" ry="14"/><ellipse cx="1000" cy="420" rx="26" ry="12"/><ellipse cx="740" cy="372" rx="28" ry="12"/></g>
</svg>
