<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>모니터에 띄운 월하당 홈페이지 (2025.10.29)</title>
  <!-- 다은 블로그 '월하당 홈페이지를 만들었다'. 창작 화면. 이때는 상중 전이라 근조 띠가 없다. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3631"/><stop offset="1" stop-color="#1f1c19"/></linearGradient>
    <linearGradient id="hanji" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5ead0"/><stop offset="1" stop-color="#ead9b4"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f1717"/><stop offset="1" stop-color="#5e0c0c"/></linearGradient>
    <radialGradient id="flame" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#fff7c8"/><stop offset=".5" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#cfe0ff" stop-opacity=".25"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#room)"/>
  <ellipse cx="600" cy="360" rx="560" ry="340" fill="url(#glow)"/>
  <!-- 모니터 -->
  <rect x="170" y="60" width="860" height="540" rx="18" fill="#141416"/>
  <rect x="196" y="84" width="808" height="476" fill="url(#hanji)"/>
  <!-- 화면: 붉은 프레임 -->
  <rect x="210" y="98" width="780" height="448" fill="none" stroke="#8b1616" stroke-width="5"/>
  <rect x="210" y="98" width="780" height="64" fill="url(#head)"/>
  <text x="600" y="143" text-anchor="middle" font-family="'Song Myung','Nanum Myeongjo','AppleMyungjo','Batang',serif" font-size="38" fill="#f3d27a" letter-spacing="10">月下堂</text>
  <text x="600" y="186" text-anchor="middle" font-family="'Nanum Myeongjo','AppleMyungjo','Batang',serif" font-size="17" fill="#6b1010">송만신 신점 · 점사 · 사주 · 굿 봐드립니다</text>
  <!-- 왼쪽 메뉴 -->
  <g fill="#fbf3dd" stroke="#a52a2a" stroke-width="2">
    <rect x="226" y="208" width="150" height="30"/><rect x="226" y="246" width="150" height="30"/><rect x="226" y="284" width="150" height="30"/>
    <rect x="226" y="322" width="150" height="30"/><rect x="226" y="360" width="150" height="30"/><rect x="226" y="398" width="150" height="30"/>
  </g>
  <g fill="#8b1616"><rect x="240" y="219" width="80" height="8"/><rect x="240" y="257" width="96" height="8"/><rect x="240" y="295" width="70" height="8"/><rect x="240" y="333" width="88" height="8"/><rect x="240" y="371" width="76" height="8"/><rect x="240" y="409" width="92" height="8"/></g>
  <!-- BGM 버튼 -->
  <rect x="226" y="444" width="150" height="26" rx="13" fill="#2b1a10"/><text x="301" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f3d27a">BGM ♪ 재생</text>
  <!-- 가운데: 촛불 둘과 연꽃 -->
  <g transform="translate(540 300)">
    <rect x="-8" y="10" width="16" height="70" fill="#f5f0e4" stroke="#d8cdb4"/>
    <ellipse cx="0" cy="-6" rx="16" ry="28" fill="url(#flame)"/><ellipse cx="0" cy="0" rx="5" ry="12" fill="#fffbe6"/>
  </g>
  <g transform="translate(860 300)">
    <rect x="-8" y="10" width="16" height="70" fill="#f5f0e4" stroke="#d8cdb4"/>
    <ellipse cx="0" cy="-6" rx="16" ry="28" fill="url(#flame)"/><ellipse cx="0" cy="0" rx="5" ry="12" fill="#fffbe6"/>
  </g>
  <g transform="translate(700 350)" fill="#f2a7b6" stroke="#c46a80" stroke-width="2">
    <path d="M0 30 C-20 0 -16 -30 0 -50 C16 -30 20 0 0 30 Z"/>
    <path d="M0 30 C-40 20 -56 -6 -50 -30 C-26 -20 -10 6 0 30 Z"/><path d="M0 30 C40 20 56 -6 50 -30 C26 -20 10 6 0 30 Z"/>
    <path d="M-60 34 C-30 44 30 44 60 34" fill="none" stroke="#5e8a52" stroke-width="5"/>
  </g>
  <!-- 반짝이 -->
  <g fill="#ffe27a">
    <path d="M470 230 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/><path d="M930 240 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
    <path d="M780 240 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/><path d="M620 440 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
  <!-- 공지 줄 -->
  <g fill="#c9b48e"><rect x="420" y="452" width="520" height="8"/><rect x="420" y="470" width="460" height="8"/><rect x="420" y="488" width="500" height="8"/></g>
  <!-- 방문자 카운터 -->
  <rect x="226" y="490" width="150" height="40" fill="#111"/>
  <text x="301" y="518" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" fill="#ff3b3b" letter-spacing="2">0000127</text>
  <!-- 모니터 받침과 메모지 -->
  <rect x="560" y="600" width="80" height="80" fill="#1c1c1f"/><rect x="460" y="676" width="280" height="22" rx="8" fill="#232326"/>
  <g transform="rotate(-6 1000 110)"><rect x="950" y="70" width="110" height="96" fill="#f6e46a"/><text x="1005" y="124" text-anchor="middle" font-family="'Nanum Pen Script','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#5a4a10">반짝반짝!</text></g>
  <!-- 키보드 일부 -->
  <path d="M120 760 L1080 760 L1120 800 H80 Z" fill="#2c2b2e"/>
  <g fill="#3d3c40"><rect x="180" y="768" width="60" height="16" rx="3"/><rect x="250" y="768" width="60" height="16" rx="3"/><rect x="320" y="768" width="60" height="16" rx="3"/><rect x="390" y="768" width="60" height="16" rx="3"/><rect x="460" y="768" width="60" height="16" rx="3"/><rect x="530" y="768" width="60" height="16" rx="3"/><rect x="600" y="768" width="60" height="16" rx="3"/><rect x="670" y="768" width="60" height="16" rx="3"/><rect x="740" y="768" width="60" height="16" rx="3"/><rect x="810" y="768" width="60" height="16" rx="3"/><rect x="880" y="768" width="60" height="16" rx="3"/></g>
</svg>
