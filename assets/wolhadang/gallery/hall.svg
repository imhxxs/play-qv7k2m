  <g stroke="#e8c46a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M360 325v14q0 3-3 4M360 325h10v16M360 330h10M360 335h10"/><path d="M380 326h20M390 326v16M392 331l4 3"/><path d="M412 324v3M406 325l1 2M418 325l-1 2M404 328h24M412 330h8v3h-8zM406 337h20M416 333v8M404 342h24"/>
  </g>
