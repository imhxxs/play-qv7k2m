  <g stroke="#5a3418" stroke-width="7"><path d="M200 330 V470M300 330V470M400 330V470M500 330V470M590 330V470"/></g>
  <rect x="318" y="372" width="64" height="98" fill="#8b1616"/><path d="M350 372 V470" stroke="#5a0a0a" stroke-width="2"/>
  <rect x="222" y="362" width="60" height="50" fill="url(#win)"/><rect x="420" y="362" width="60" height="50" fill="url(#win)"/><rect x="516" y="362" width="56" height="50" fill="url(#win)"/>
  <g stroke="#7a5428" stroke-width="1.5"><path d="M222 387h60M252 362v50M420 387h60M450 362v50M516 387h56M544 362v50"/></g>
  <g filter="url(#glow)" opacity=".5" fill="#ffc870"><rect x="222" y="362" width="60" height="50"/><rect x="420" y="362" width="60" height="50"/><rect x="516" y="362" width="56" height="50"/></g>
  <!-- 지붕 -->
  <path d="M150 336 C220 318 300 300 395 296 C490 300 570 318 640 336 L612 300 C540 282 470 256 395 252 C320 256 250 282 178 300 Z" fill="url(#roof)"/>
  <path d="M150 336 C220 318 300 300 395 296 C490 300 570 318 640 336" fill="none" stroke="#14141a" stroke-width="5"/>
  <g stroke="#4a4a56" stroke-width="2" opacity=".8"><path d="M210 312 L222 292M250 306 L260 280M290 300 L298 272M330 297 L336 266M370 296 L373 258M410 296 L412 256M450 298 L452 262M490 302 L496 268M530 308 L538 276M570 316 L582 290"/></g>
  <path d="M290 262 C330 246 460 246 500 262" stroke="#14141a" stroke-width="7" fill="none"/>
