<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>서월산 아래 월하당 (2025.10.14)</title>
  <!-- 창작 일러스트: 해 질 녘 서월산 아래 기와집 신당, 마당 감나무, 초승달 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a52"/><stop offset=".45" stop-color="#7a4a6a"/><stop offset=".8" stop-color="#e08a5a"/><stop offset="1" stop-color="#f3b878"/></linearGradient>
    <linearGradient id="mt1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3550"/><stop offset="1" stop-color="#4a3a48"/></linearGradient>
    <linearGradient id="mt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a3a"/><stop offset="1" stop-color="#2a2430"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset="1" stop-color="#22222a"/></linearGradient>
    <linearGradient id="wallh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcc0"/><stop offset="1" stop-color="#c9b48e"/></linearGradient>
    <radialGradient id="win" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#e09a40"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .4 0 0 0 .13 0"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
