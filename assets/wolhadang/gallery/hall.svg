  <circle cx="632" cy="96" r="30" fill="#fff6d8" filter="url(#glow)" opacity=".6"/>
  <path d="M632 66 a30 30 0 1 0 22 50 a24 24 0 1 1 -22 -50z" fill="#fff4d0"/>
  <g fill="#fff" opacity=".7"><circle cx="120" cy="60" r="1.4"/><circle cx="260" cy="40" r="1"/><circle cx="420" cy="80" r="1.2"/><circle cx="520" cy="30" r="1"/><circle cx="720" cy="170" r="1.2"/></g>
  <!-- 서월산 -->
  <path d="M0 330 L120 240 L200 270 L320 160 L410 230 L470 200 L580 270 L700 220 L800 280 V600 H0 Z" fill="url(#mt1)"/>
  <path d="M0 380 L90 330 L180 350 L280 300 L380 340 L480 310 L600 350 L720 320 L800 350 V600 H0 Z" fill="url(#mt2)"/>
  <!-- 담장 -->
