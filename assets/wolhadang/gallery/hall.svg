  <path d="M676 470 C672 420 664 390 640 360 M668 420 C690 392 708 380 726 372 M652 380 C630 360 618 350 600 346" stroke="#3a2414" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g fill="#2a3a24" opacity=".85"><circle cx="640" cy="350" r="34"/><circle cx="690" cy="340" r="38"/><circle cx="730" cy="370" r="28"/><circle cx="604" cy="344" r="22"/></g>
  <g fill="#f07a20"><circle cx="628" cy="340" r="6"/><circle cx="660" cy="324" r="6"/><circle cx="700" cy="356" r="6"/><circle cx="724" cy="334" r="6"/><circle cx="742" cy="380" r="5"/><circle cx="610" cy="360" r="5"/><circle cx="680" cy="372" r="6"/></g>
  <!-- 마당 -->
  <path d="M0 505 H800 V600 H0 Z" fill="#6a5440"/>
  <path d="M0 505 H800" stroke="#4a3a2a" stroke-width="3"/>
  <g fill="#e66b8d" opacity=".9"><path d="M110 470 v-80 l26 10 -26 10z"/></g>
  <path d="M110 470 V380" stroke="#3a2414" stroke-width="3"/>
  <rect width="800" height="600" filter="url(#grain)"/>
  <text x="772" y="584" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="700" fill="#ff8a2a" opacity=".9">2025.10.14</text>
