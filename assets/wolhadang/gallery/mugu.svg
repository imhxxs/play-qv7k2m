<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>만신님 방울과 부채 (2026.01.15)</title>
  <!-- 창작 일러스트: 붉은 천 위의 부채와 방울(무구). 경건하게. -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3191f"/><stop offset="1" stop-color="#5c0b0b"/></linearGradient>
    <radialGradient id="bell" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff2c0"/><stop offset=".5" stop-color="#d9b05a"/><stop offset="1" stop-color="#8a5f22"/></radialGradient>
    <radialGradient id="lite" cx="40%" cy="30%" r="70%"><stop offset="0" stop-color="#ffe0a0" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .35 0 0 0 .14 0"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#red)"/>
  <g stroke="#3a0606" stroke-width="3" opacity=".35" fill="none"><path d="M0 140 C200 160 420 120 800 150"/><path d="M0 420 C260 400 520 440 800 410"/><path d="M120 0 C140 200 100 400 130 600"/></g>
  <!-- 부채 -->
  <g transform="translate(300 400)">
    <path d="M0 0 L-200 -120 A232 232 0 0 1 120 -196 Z" fill="#f5e7c0" stroke="#7a5428" stroke-width="3"/>
    <g stroke="#b8862a" stroke-width="2"><path d="M0 0 L-170 -158M0 0 L-128 -186M0 0 L-80 -208M0 0 L-28 -218M0 0 L26 -216M0 0 L76 -206"/></g>
    <circle cx="-110" cy="-150" r="26" fill="#d32f2f"/>
    <path d="M30 -180 a24 24 0 1 0 18 40 a19 19 0 1 1 -18 -40z" fill="#f3d27a" stroke="#b8862a"/>
    <path d="M-160 -96 q80 -50 160 -10 q50 20 100 -30" fill="none" stroke="#2f9a4a" stroke-width="7"/>
    <path d="M-140 -70 q70 -40 140 -6 q50 18 90 -26" fill="none" stroke="#2f5fd3" stroke-width="5"/>
    <rect x="-10" y="-6" width="20" height="40" rx="4" fill="#6a4420"/>
  </g>
  <!-- 방울 -->
  <g transform="translate(560 300)">
    <path d="M0 40 V200" stroke="#5a3a1a" stroke-width="12" stroke-linecap="round"/>
    <g stroke-width="7" stroke-linecap="round"><path d="M0 190 C-30 230 -40 270 -60 300" stroke="#d32f2f"/><path d="M0 190 C-10 240 -10 270 -20 310" stroke="#f3d27a"/><path d="M0 190 C10 240 20 280 20 310" stroke="#2f5fd3"/><path d="M0 190 C30 230 50 270 60 300" stroke="#2f9a4a"/><path d="M0 190 C40 220 70 240 100 260" stroke="#f6f1e2"/></g>
    <g>
      <circle cx="-34" cy="10" r="24" fill="url(#bell)"/><circle cx="20" cy="2" r="24" fill="url(#bell)"/><circle cx="-8" cy="-36" r="24" fill="url(#bell)"/>
      <circle cx="42" cy="-40" r="22" fill="url(#bell)"/><circle cx="-50" cy="-30" r="22" fill="url(#bell)"/><circle cx="8" cy="44" r="22" fill="url(#bell)"/>
      <g stroke="#3a2008" stroke-width="3" stroke-linecap="round"><path d="M-44 14h20M10 6h20M-18 -32h20M32 -36h18M-60 -26h18M-2 48h18"/></g>
    </g>
  </g>
  <rect width="800" height="600" fill="url(#lite)"/>
  <rect width="800" height="600" filter="url(#grain)"/>
  <text x="772" y="584" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="700" fill="#ff8a2a" opacity=".9">2026.01.15</text>
</svg>
