  <path d="M452 78 C448 80 448 84 452 86 C456 84 456 80 452 78" fill="none" stroke="#b3242a" stroke-width="2"/>

  <!-- 무신도(최영 장군님, 창작·추상) -->
  <g>
    <rect x="186" y="76" width="180" height="9" rx="4" fill="#3a2414"/>
    <circle cx="186" cy="80.5" r="6" fill="#6b4423"/><circle cx="366" cy="80.5" r="6" fill="#6b4423"/>
    <rect x="196" y="85" width="160" height="322" fill="#2c5552"/>
    <path d="M196 95h160M196 397h160" stroke="#c9a24a" stroke-width="1.2" opacity=".7"/>
    <rect x="208" y="100" width="136" height="290" fill="url(#silk)"/>
    <!-- 구름 -->
    <g fill="none" stroke="#9ab3c4" stroke-width="2" opacity=".7">
      <path d="M216 120c6-8 16-4 16 2 6-6 14 0 10 6"/><path d="M302 112c6-8 16-4 16 2 6-6 14 0 10 6"/><path d="M220 360c8-6 18-2 16 4 8-4 14 2 8 8"/>
    </g>
    <circle cx="276" cy="150" r="30" fill="#f3d27a" opacity=".55"/>
