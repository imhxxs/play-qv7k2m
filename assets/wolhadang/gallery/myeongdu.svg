<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>장군님 상과 명두 (2026.09.06)</title>
  <!-- 월하당 신당 북쪽 벽(창작 일러스트). 현판 月下堂 / 왼쪽 무신도(최영 장군, 추상) / 무신도 오른쪽 벽의 명두 /
       아래 장군님 상과 상차림. 명두: 지름 36cm ≈ 160px, 상 위 40cm ≈ 178px, 가운데 지름 40%에 日月·북두칠성, 바깥 띠는 민무늬 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c49c"/><stop offset=".6" stop-color="#e6d6b2"/><stop offset="1" stop-color="#cdb68c"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="78%" r="75%">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".28"/><stop offset=".6" stop-color="#ffb24a" stop-opacity=".06"/><stop offset="1" stop-color="#2a1608" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="brass" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#fff4c8"/><stop offset=".22" stop-color="#f0d185"/><stop offset=".55" stop-color="#c6984a"/><stop offset=".85" stop-color="#9a6f2e"/><stop offset="1" stop-color="#6e4a1a"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#e2bf70"/><stop offset="1" stop-color="#b48a3e"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c18"/><stop offset="1" stop-color="#2c180c"/></linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="68"><stop offset="0" stop-color="#ffe6a0"/><stop offset="1" stop-color="#c9962b"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1e2"/><stop offset="1" stop-color="#e5dcc6"/></linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9d6a8"/><stop offset=".5" stop-color="#f3e5c0"/><stop offset="1" stop-color="#e3cf9e"/></linearGradient>
    <radialGradient id="flame" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .16 0"/>
    </filter>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 3h6M3 0v6" stroke="#d8ccb0" stroke-width=".6"/></pattern>
  </defs>

  <!-- 벽과 기둥 -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect width="800" height="600" filter="url(#grain)"/>
  <rect x="0" y="0" width="24" height="600" fill="#5a3418"/><rect x="776" y="0" width="24" height="600" fill="#5a3418"/>
  <rect x="0" y="0" width="800" height="9" fill="#4a2a12"/>

  <!-- 현판 月下堂 -->
  <path d="M318 9 L330 18 M482 9 L470 18" stroke="#8a1a1a" stroke-width="2"/>
  <rect x="296" y="16" width="208" height="56" rx="3" fill="url(#board)" stroke="#7a4a24" stroke-width="3"/>
  <rect x="304" y="22" width="192" height="44" fill="none" stroke="#a87a3a" stroke-width="1" opacity=".7"/>
  <g fill="none" stroke="url(#gold)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
