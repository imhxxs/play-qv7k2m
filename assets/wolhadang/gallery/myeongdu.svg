    <!-- 下 -->
    <g transform="translate(378 24)">
      <path d="M3 6 H41"/><path d="M22 6 V41"/><path d="M25 18 L34 26"/>
    </g>
    <!-- 堂 -->
    <g transform="translate(432 22)" stroke-width="4.4">
      <path d="M22 2 V9"/><path d="M12 4 L15 9"/><path d="M33 4 L30 9"/>
      <path d="M5 12 V17"/><path d="M5 12 H40 V17"/>
      <path d="M14 17 H31 V24 H14 Z"/>
      <path d="M10 32 H35"/><path d="M22.5 26 V42"/><path d="M5 43 H40"/>
    </g>
  </g>

