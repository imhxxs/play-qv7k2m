<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>정월 대보름 쌀 한 말 나눔 (2026.03.03)</title>
  <!-- 창작 일러스트: 마당에 쌓은 쌀 포대와 나무 됫박 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0ea"/><stop offset="1" stop-color="#f3ecd8"/></linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6dcc4"/><stop offset=".5" stop-color="#f6f0e0"/><stop offset="1" stop-color="#d6cab0"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8834a"/><stop offset="1" stop-color="#7a4a22"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="13"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .35 0 0 0 .12 0"/></filter>
    <g id="sk">
      <path d="M-70 -90 Q0 -110 70 -90 L80 80 Q0 96 -80 80 Z" fill="url(#sack)" stroke="#a89a7a" stroke-width="2"/>
      <path d="M-74 -40 H74" stroke="#c0392b" stroke-width="10"/><path d="M-74 -22 H74" stroke="#2f5fd3" stroke-width="5"/>
      <circle cx="0" cy="22" r="22" fill="none" stroke="#c0392b" stroke-width="4"/>
      <path d="M-60 -96 Q0 -120 60 -96" fill="none" stroke="#8a7a5a" stroke-width="3"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 250 H800 V600 H0 Z" fill="#a8906a"/>
  <path d="M0 250 H800" stroke="#7a6a4a" stroke-width="3"/>
  <rect x="0" y="150" width="800" height="100" fill="#8a7a66"/><path d="M0 150 H800" stroke="#3a3a44" stroke-width="10"/>
  <use href="#sk" x="160" y="380"/><use href="#sk" x="320" y="400"/><use href="#sk" x="240" y="260" transform="rotate(-4 240 260)"/>
  <use href="#sk" x="470" y="390"/>
  <!-- 됫박 -->
  <g transform="translate(640 470)">
    <path d="M-80 -40 L80 -40 L66 70 L-66 70 Z" fill="url(#wood)" stroke="#4a2a12" stroke-width="3"/>
    <path d="M-80 -40 Q0 -100 80 -40 Z" fill="#fbf6e8"/>
    <g fill="#e9e0c8"><ellipse cx="-30" cy="-56" rx="4" ry="2"/><ellipse cx="0" cy="-66" rx="4" ry="2" transform="rotate(30)"/><ellipse cx="24" cy="-54" rx="4" ry="2" transform="rotate(-20 24 -54)"/><ellipse cx="44" cy="-46" rx="4" ry="2"/><ellipse cx="-52" cy="-46" rx="4" ry="2"/></g>
    <path d="M-60 0 H60M-62 34 H62" stroke="#5a3418" stroke-width="2" opacity=".6"/>
  </g>
  <g fill="#fbf6e8"><ellipse cx="560" cy="560" rx="4" ry="2"/><ellipse cx="590" cy="574" rx="4" ry="2" transform="rotate(40 590 574)"/><ellipse cx="700" cy="566" rx="4" ry="2"/><ellipse cx="730" cy="548" rx="4" ry="2"/></g>
  <rect width="800" height="600" filter="url(#grain)"/>
  <text x="772" y="584" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="700" fill="#ff8a2a" opacity=".9">2026.03.03</text>
