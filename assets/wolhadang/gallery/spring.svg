<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>봄맞이 신당 단장 — 지화 (2026.04.05)</title>
  <!-- 창작 일러스트: 상 위에 색종이, 가위, 다 접은 종이꽃(지화) -->
  <defs>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a5a2a"/><stop offset="1" stop-color="#6a3a18"/></linearGradient>
    <radialGradient id="sun" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#fff2c8" stop-opacity=".5"/><stop offset="1" stop-color="#fff2c8" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="21"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .12 0"/></filter>
    <g id="flower">
      <circle r="26" fill="currentColor"/>
      <g fill="none" stroke="#000" stroke-opacity=".12" stroke-width="2"><circle r="18"/><circle r="10"/></g>
      <path d="M-26 0 q13 -8 26 0 q13 8 26 0 M0 -26 q-8 13 0 26 q8 13 0 26" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none"/>
      <circle r="5" fill="#f3d27a"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#tbl)"/>
  <g stroke="#5a2a10" stroke-width="2" opacity=".5"><path d="M0 120 C200 110 600 130 800 116"/><path d="M0 300 C220 290 560 310 800 296"/><path d="M0 470 C260 460 540 480 800 466"/></g>
  <!-- 색종이 -->
  <rect x="70" y="70" width="190" height="150" fill="#e66b8d" transform="rotate(-6 165 145)"/>
  <rect x="110" y="100" width="190" height="150" fill="#f3d27a" transform="rotate(4 205 175)"/>
  <rect x="150" y="130" width="190" height="150" fill="#f6f1e2" transform="rotate(-2 245 205)"/>
  <!-- 가위 -->
  <g transform="translate(560 140) rotate(30)">
    <circle cx="-30" cy="0" r="16" fill="none" stroke="#c0392b" stroke-width="7"/><circle cx="30" cy="0" r="16" fill="none" stroke="#c0392b" stroke-width="7"/>
    <path d="M-18 -8 L60 -120 L66 -116 L-8 0 Z" fill="#c8ccd0"/><path d="M18 -8 L-60 -120 L-66 -116 L8 0 Z" fill="#b8bcc0"/>
  </g>
  <!-- 접은 지화 -->
  <g color="#e66b8d"><use href="#flower" x="420" y="360"/><use href="#flower" x="300" y="430"/><use href="#flower" x="640" y="470"/></g>
  <g color="#d32f2f"><use href="#flower" x="520" y="410"/><use href="#flower" x="180" y="380"/></g>
  <g color="#f3d27a"><use href="#flower" x="380" y="500"/><use href="#flower" x="700" y="360"/></g>
  <g color="#f6f1e2"><use href="#flower" x="250" y="520"/><use href="#flower" x="560" y="520"/><use href="#flower" x="100" y="480"/></g>
  <g stroke="#3a6a2a" stroke-width="4" stroke-linecap="round"><path d="M420 386 L440 470M520 436 L500 560M180 406 L160 520"/></g>
  <rect width="800" height="600" fill="url(#sun)"/>
  <rect width="800" height="600" filter="url(#grain)"/>
  <text x="772" y="584" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="700" fill="#ff8a2a" opacity=".9">2026.04.05</text>
</svg>
