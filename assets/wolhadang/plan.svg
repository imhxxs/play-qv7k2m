<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" width="640" height="570" font-family="'Nanum Gothic','Gulim','Dotum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="plan-svg-t">월하당 신당 평면도 — 위쪽이 북쪽. 신당(4.2×3.6m) 북쪽 벽에 장군님 상, 그 위 벽에 무신도와 무신도 오른쪽의 명두. 신당 서쪽 벽 북쪽 끝에 뒷문(뒤꼍: 툇마루·아궁이), 뒷문 안쪽에 기둥. 동쪽 벽에 안방 옆문과 그 남쪽의 시렁. 남쪽 벽 가운데 앞문(마당). 안방 한지창은 마당 쪽. 안방에서 뒤꼍으로 난 문은 없고, 뒤꼍과 마당은 옆 골목으로 이어진다.</title>
  <!-- 월하당 신당 평면도(창작). 막내 명월 그림. 비율: 신당 4.2m = 280px(1m ≈ 66.7px) -->
  <defs>
    <pattern id="jangpan" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f3dc94"/><path d="M20 0H0V20" fill="none" stroke="#dcbf6a" stroke-width="1"/>
    </pattern>
    <pattern id="maru" width="12" height="40" patternUnits="userSpaceOnUse">
      <rect width="12" height="40" fill="#c99a5e"/><path d="M0 0V40" stroke="#9a6d3a" stroke-width="1.2"/>
    </pattern>
    <pattern id="dirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#e8d7ae"/><circle cx="4" cy="5" r=".9" fill="#c9b07a"/><circle cx="12" cy="11" r=".7" fill="#cdb684"/>
    </pattern>
    <pattern id="lattice" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fffaf0"/><path d="M0 4H8M4 0V8" stroke="#9a7a4a" stroke-width=".8"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6a4a2a"/></marker>
  </defs>

  <rect width="640" height="570" fill="#fffdf6"/>
  <text x="20" y="28" font-size="17" font-weight="800" fill="#5c0b0b">月下堂 신당 평면도</text>
  <text x="20" y="46" font-size="11" fill="#8a7259">처음 오시는 분 안내 · 막내 그림</text>

  <!-- 북쪽 표시 -->
  <g transform="translate(598 34)">
    <circle r="16" fill="#fff" stroke="#8a6a3a"/>
    <path d="M0 -12 6 6 0 2-6 6z" fill="#b3242a"/>
    <text y="-19" font-size="11" font-weight="800" text-anchor="middle" fill="#5c0b0b">북</text>
  </g>

  <!-- 담장 -->
  <path d="M22 62H626V532H392M332 532H22Z" fill="none" stroke="#7a6a5a" stroke-width="5" stroke-linejoin="round"/>

  <!-- 마당 -->
  <rect x="122" y="342" width="500" height="186" fill="url(#dirt)"/>
  <!-- 뒤꼍 -->
  <rect x="26" y="66" width="120" height="270" fill="#ddd3c0"/>
  <!-- 옆 골목 -->
  <rect x="26" y="336" width="96" height="192" fill="#e2dccd"/>
  <path d="M84 300 C84 390 84 420 92 446 C100 470 116 476 150 476" fill="none" stroke="#6a4a2a" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arr)"/>

  <!-- 툇마루 -->
  <rect x="146" y="104" width="26" height="232" fill="url(#maru)" stroke="#8a5a2a" stroke-width="1"/>
  <!-- 아궁이 -->
  <g transform="translate(58 150)">
    <rect x="-22" y="-14" width="44" height="30" fill="#8a7a6a" stroke="#5a4a3a" stroke-width="1.5"/>
    <path d="M-11 16V2a11 11 0 0 1 22 0v14z" fill="#2a1a10"/>
    <path d="M-4 12c0-5 4-6 4-10 3 3 4 6 4 10z" fill="#e2702a"/>
  </g>
  <!-- 장독대(그냥 그림) -->
  <g fill="#7a4a2a" stroke="#4a2a1a">
    <ellipse cx="50" cy="262" rx="13" ry="11"/><ellipse cx="80" cy="270" rx="10" ry="9"/><ellipse cx="62" cy="290" rx="9" ry="8"/>
  </g>

  <!-- 신당 -->
  <rect x="172" y="100" width="280" height="240" fill="url(#jangpan)"/>
  <!-- 안방 -->
  <rect x="452" y="100" width="164" height="200" fill="#f6ecd3"/>
  <path d="M452 100h164v200H452" fill="none" stroke="#3a2a1a" stroke-width="5"/>
  <!-- 벽(문 자리는 비움) -->
  <g stroke="#3a2a1a" stroke-width="5" fill="none" stroke-linecap="square">
    <path d="M172 116V100H452V180"/>
    <path d="M452 216V340H342"/>
    <path d="M282 340H172V152"/>
  </g>
  <!-- 안방 남쪽 벽의 한지창 -->
  <rect x="488" y="295" width="84" height="10" fill="url(#lattice)" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- 문: 앞문·뒷문·안방 옆문(여닫이 표시) -->
  <g fill="none" stroke="#8b1616" stroke-width="2">
    <path d="M282 340v-28M342 340v-28"/>
    <path d="M282 312a28 28 0 0 1 28 28M342 312a28 28 0 0 0-28 28" stroke-dasharray="3 3"/>
    <path d="M172 116h-22M172 152h-22" />
    <path d="M150 116a36 36 0 0 0 0 36" stroke-dasharray="3 3"/>
    <path d="M452 180h20M452 216h20"/>
    <path d="M472 180a36 36 0 0 1 0 36" stroke-dasharray="3 3"/>
  </g>
  <rect x="282" y="337" width="60" height="6" fill="#fffdf6"/>
  <rect x="169" y="116" width="6" height="36" fill="#fffdf6"/>
  <rect x="449" y="180" width="6" height="36" fill="#fffdf6"/>

  <!-- 장군님 상(폭 1.2m) -->
  <rect x="262" y="106" width="80" height="26" fill="#a0522d" stroke="#5a2a10" stroke-width="1.5"/>
  <rect x="262" y="130" width="80" height="6" fill="#f6f1e2" stroke="#b9a98a" stroke-width=".8"/>
  <!-- 무신도·명두(북쪽 벽, 상 위) -->
  <rect x="268" y="95" width="30" height="7" fill="#c0392b" stroke="#5a2a10"/>
  <circle cx="318" cy="98" r="7" fill="#d9b45a" stroke="#7a5520" stroke-width="1.5"/>
  <!-- 기둥 -->
  <rect x="222" y="140" width="15" height="15" fill="#6b4423" stroke="#3a2010" stroke-width="1.5"/>
  <!-- 시렁(동쪽 벽) -->
  <rect x="434" y="236" width="14" height="84" fill="#b8865a" stroke="#6a4420" stroke-width="1.5"/>
  <g fill="#e66b8d"><circle cx="441" cy="246" r="3"/><circle cx="441" cy="262" r="3" fill="#f3d27a"/><circle cx="441" cy="278" r="3" fill="#f6f1e2"/><circle cx="441" cy="300" r="3"/></g>
  <!-- 악사 자리 -->
  <g fill="#7a3a2a" stroke="#4a1a10" stroke-width="1"><circle cx="200" cy="262" r="9"/><circle cx="224" cy="272" r="9"/><circle cx="204" cy="290" r="9"/></g>

  <!-- 마당: 감나무, 평상, 대문 -->
  <g transform="translate(548 420)">
    <circle r="40" fill="#7aa35a" opacity=".85"/>
    <circle r="40" fill="none" stroke="#4f7a3a" stroke-width="1.5"/>
    <g fill="#e8742a"><circle cx="-14" cy="-10" r="4"/><circle cx="10" cy="-18" r="4"/><circle cx="18" cy="6" r="4"/><circle cx="-6" cy="14" r="4"/><circle cx="-24" cy="10" r="3.5"/></g>
    <circle r="6" fill="#6b4423"/>
  </g>
  <rect x="390" y="420" width="70" height="34" fill="url(#maru)" stroke="#7a5020" stroke-width="1.5"/>
  <path d="M332 532h60" stroke="#8b1616" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- 큰 이름 -->
  <g font-weight="800" fill="#5c0b0b" text-anchor="middle">
    <text x="330" y="236" font-size="26" letter-spacing="8" opacity=".85">신당</text>
    <text x="330" y="258" font-size="11" font-weight="400" fill="#7a5a3a">4.2 × 3.6m</text>
    <text x="540" y="168" font-size="22" letter-spacing="6">안방</text>
    <text x="90" y="92" font-size="17" letter-spacing="4">뒤꼍</text>
    <text x="300" y="404" font-size="22" letter-spacing="8">마당</text>
  </g>
  <text x="70" y="398" font-size="12" font-weight="700" fill="#6a4a2a" writing-mode="tb" letter-spacing="2">옆 골목</text>

  <!-- 작은 이름 -->
  <g font-size="11" fill="#3a2a1a">
    <text x="302" y="148" text-anchor="middle">장군님 상</text>
    <text x="283" y="88" text-anchor="middle">무신도</text>
    <text x="330" y="88">명두</text>
    <text x="240" y="170">기둥</text>
    <text x="441" y="230" text-anchor="middle">시렁</text>
    <text x="478" y="232">안방 옆문</text>
    <text x="530" y="324" text-anchor="middle">한지창</text>
    <text x="312" y="360" text-anchor="middle">앞문</text>
    <text x="178" y="112" text-anchor="start">뒷문</text>
    <text x="160" y="352" text-anchor="middle">툇마루</text>
    <text x="58" y="186" text-anchor="middle">아궁이</text>
    <text x="214" y="318" text-anchor="middle">악사 자리</text>
    <text x="548" y="476" text-anchor="middle">감나무</text>
    <text x="425" y="470" text-anchor="middle">평상</text>
    <text x="362" y="548" text-anchor="middle">대문</text>
    <text x="64" y="238" text-anchor="middle" fill="#6a5a4a">장독대</text>
  </g>
  <path d="M160 340v4" stroke="#8a5a2a"/>

  <!-- 번호(오른쪽 설명과 같다) -->
  <g font-size="11" font-weight="800" text-anchor="middle" fill="#fff">
    <g transform="translate(312 324)"><circle r="9.5" fill="#b3242a"/><text y="4">1</text></g>
    <g transform="translate(192 134)"><circle r="9.5" fill="#b3242a"/><text y="4">2</text></g>
    <g transform="translate(229 182)"><circle r="9.5" fill="#b3242a"/><text y="4">3</text></g>
    <g transform="translate(354 120)"><circle r="9.5" fill="#b3242a"/><text y="4">4</text></g>
    <g transform="translate(240 92)"><circle r="9.5" fill="#b3242a"/><text y="4">5</text></g>
    <g transform="translate(366 84)"><circle r="9.5" fill="#b3242a"/><text y="4">6</text></g>
    <g transform="translate(414 278)"><circle r="9.5" fill="#b3242a"/><text y="4">7</text></g>
    <g transform="translate(482 198)"><circle r="9.5" fill="#b3242a"/><text y="4">8</text></g>
    <g transform="translate(590 300)"><circle r="9.5" fill="#b3242a"/><text y="4">9</text></g>
    <g transform="translate(120 92)"><circle r="9.5" fill="#b3242a"/><text y="4">10</text></g>
    <g transform="translate(250 404)"><circle r="9.5" fill="#b3242a"/><text y="4">11</text></g>
    <g transform="translate(70 456)"><circle r="9.5" fill="#b3242a"/><text y="4">12</text></g>
    <g transform="translate(246 290)"><circle r="9.5" fill="#b3242a"/><text y="4">13</text></g>
    <g transform="translate(406 532)"><circle r="9.5" fill="#b3242a"/><text y="4">14</text></g>
  </g>

  <!-- 축척 -->
  <g transform="translate(470 556)" font-size="10" fill="#5a4a3a">
    <path d="M0 0h66.7" stroke="#3a2a1a" stroke-width="2"/><path d="M0-4v8M66.7-4v8" stroke="#3a2a1a" stroke-width="1.5"/>
    <text x="74" y="4">1m</text>
  </g>
  <text x="20" y="566" font-size="10.5" fill="#8b1616">※ 안방에서 뒤꼍으로 나가는 문은 없어요. 뒤꼍 ↔ 마당은 옆 골목으로.</text>
</svg>
