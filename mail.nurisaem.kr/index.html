<!doctype html>
<html lang="ko">
<head>
<script src="../play-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24408e">
<title>누리메일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Myeongjo:wght@400;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="mail.css">
</head>
<body>
<div class="app" id="app" data-pane="list" data-mode="mail">
  <header class="bar">
    <button class="bar__menu icobtn" id="btn-menu" type="button" aria-label="메일함 목록 열기" aria-controls="folders" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#inbox" aria-label="누리메일 — 받은편지함">
      <svg class="brand__drop" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5c5 6.6 8.4 10.8 8.4 15A8.4 8.4 0 0 1 7.6 18.5C7.6 14.3 11 10.1 16 3.5z" fill="#fff"/><path d="M12 19.4a4.1 4.1 0 0 0 3.7 3.9" fill="none" stroke="#24408e" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="brand__name"><b>누리</b>메일</span>
    </a>
    <div class="bar__me" id="me"></div>
    <a class="bar__compose" href="#compose" id="bar-compose">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M13.5 8.5l3 3" stroke="currentColor" stroke-width="1.9"/></svg>
      <span>쓰기</span>
    </a>
  </header>

  <nav class="folders" id="folders" aria-label="메일함">
    <a class="folders__compose" href="#compose">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M13.5 8.5l3 3" stroke="currentColor" stroke-width="1.9"/></svg>
      메일 쓰기
    </a>
    <ul class="folders__list">
      <li><a class="folder" href="#inbox" data-folder="inbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 13.5 6 5.5h12l2.5 8v5h-17z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="folder__label">받은편지함</span><span class="folder__count" data-count="inbox"></span></a></li>
      <li><a class="folder" href="#sent" data-folder="sent">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4.5-6.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M11.5 13.5 20 4" stroke="currentColor" stroke-width="1.7"/></svg>
        <span class="folder__label">보낸편지함</span><span class="folder__count" data-count="sent"></span></a></li>
      <li><a class="folder" href="#drafts" data-folder="drafts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span class="folder__label">임시보관함</span><span class="folder__count" data-count="drafts"></span></a></li>
      <li><a class="folder" href="#spam" data-folder="spam">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19.5 6v6c0 4.3-3.2 7.4-7.5 8.5C7.7 19.4 4.5 16.3 4.5 12V6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 8.5v4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16" r="1.1" fill="currentColor"/></svg>
        <span class="folder__label">스팸함</span><span class="folder__count" data-count="spam"></span></a></li>
      <li class="folders__sep" role="presentation"></li>
      <li><a class="folder" href="#contacts" data-folder="contacts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12.5v17H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12.3" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 16.5c.8-2 2.2-3 4-3s3.2 1 4 3M3.8 7h3M3.8 12h3M3.8 17h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="folder__label">주소록</span><span class="folder__count" data-count="contacts"></span></a></li>
    </ul>
    <div class="folders__foot">
      <div class="meter" aria-hidden="true"><span style="width:3%"></span></div>
      <p>저장 공간 31MB / 5GB</p>
      <p class="folders__fine">게임 속 주소와 메일은 게임 안에서만 동작합니다.</p>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <section class="list" id="list" aria-label="메일 목록"></section>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="veil" id="veil" aria-hidden="true"></div>

<dialog class="dlg" id="dlg-pick" aria-labelledby="dlg-pick-title"></dialog>
<dialog class="dlg dlg--viewer" id="dlg-viewer" aria-labelledby="dlg-viewer-title"></dialog>

<script type="module" src="mail.js"></script>
</body>
</html>
