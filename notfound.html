<!doctype html>
<html lang="ko">
<head>
<script src="play-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서버를 찾을 수 없음</title>
<style>
  :root {
    --bg: #f3f3f1;
    --card: #ffffff;
    --text: #22252b;
    --muted: #5d6270;
    --line: #dcdde1;
    --accent: #24408e;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.65;
  }
  main {
    width: min(640px, 100%);
    margin: 0 auto;
    padding: 48px 16px 64px;
  }
  .icon { width: 72px; height: 72px; color: #8a8f9c; margin-bottom: 18px; }
  h1 { margin: 0 0 8px; font-size: clamp(22px, 6vw, 28px); line-height: 1.35; }
  .addr { margin: 0 0 22px; color: var(--muted); overflow-wrap: anywhere; }
  .addr b { color: var(--text); }
  ul { margin: 0 0 26px; padding-left: 20px; color: var(--muted); }
  li { margin: 4px 0; }
  .box {
    padding: 18px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .box p { margin: 0 0 12px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    max-width: 100%;
    padding: 10px 18px;
    border-radius: 12px;
    line-height: 1.4;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .btn:focus-visible { outline: 3px solid #9fb3ea; outline-offset: 2px; }
  .code { margin-top: 30px; font-size: 12px; color: #8a8f9c; letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M30 9 26 25l8 6-6 10 4 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>
  </svg>
  <h1 id="h">서버를 찾을 수 없습니다</h1>
  <p class="addr" id="addr"></p>
  <ul id="tips">
    <li>주소에 오타가 없는지 확인해 보세요.</li>
    <li>게임 속 주소는 게임 안에서만 열립니다.</li>
  </ul>
  <div class="box">
    <p>누리샘에서 검색해 보시겠어요?</p>
    <a class="btn" id="search" data-site="nurisaem" data-page="search">누리샘에서 검색</a>
  </div>
  <p class="code" id="code">연결 오류 · 이름을 확인할 수 없음</p>
</main>
<script type="module">
  import { boot } from './src/game.js';

  const params = new URLSearchParams(location.search);
  const u = (params.get('u') || '').trim();
  const game = boot({ siteId: 'notfound', page: 'notfound', title: '서버를 찾을 수 없음', address: u || 'about:blank' });

  const r = u ? game.resolve(u) : null;
  const addr = document.getElementById('addr');
  if (!u) {
    addr.textContent = '주소가 비어 있습니다.';
  } else if (r && !r.known) {
    // 사이트는 있는데 그런 페이지가 없음
    const name = game.sites[r.siteId]?.name || '';
    document.getElementById('h').textContent = '페이지를 찾을 수 없습니다';
    addr.replaceChildren(document.createElement('b'), document.createTextNode(` — ${name}에 이런 페이지가 없습니다.`));
    addr.firstChild.textContent = u;
    document.getElementById('code').textContent = '404 · 요청한 페이지 없음';
    document.getElementById('tips').firstElementChild.textContent = '주소를 다시 확인하거나, 사이트 첫 화면에서 찾아보세요.';
  } else {
    const b = document.createElement('b');
    b.textContent = u;
    addr.replaceChildren(b, document.createTextNode('에 연결할 수 없습니다.'));
  }

  const query = u.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').replace(/\/$/, '');
  const search = document.getElementById('search');
  if (query) {
    search.href = game.url('nurisaem', 'search', { q: query });
    search.textContent = `누리샘에서 ‘${query.length > 40 ? query.slice(0, 40) + '…' : query}’ 검색`;
  }
</script>
</body>
</html>
