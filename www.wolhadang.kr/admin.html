<!doctype html>
<html lang="ko">
<head>
<script src="../play-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b100c">
<title>관리자 로그인 — 월하당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="wolhadang.css">
</head>
<body class="wh">
<!-- 月下堂 홈페이지 · 2025.10 막내 명월 제작 -->
<div id="wh-band" class="wh-band"></div>
<table class="wh-frame" role="presentation">
<colgroup><col class="wh-col-side"><col></colgroup>
<tbody>
<tr><td class="wh-head" id="wh-head" colspan="2"></td></tr>
<tr>
<td class="wh-side" id="wh-side"></td>
<td class="wh-main" id="wh-main">
<main>
  <h1 class="wh-title">관리자 로그인 <small>월하당 › 관리자</small></h1>
  <section class="wh-admin" aria-labelledby="admin-t" data-view="X-wolhadang-admin">
    <h2 class="wh-admin__t" id="admin-t">月下堂 관리자 페이지</h2>
    <form class="wh-form" id="admin-form" novalidate autocomplete="off">
      <table role="presentation">
        <tbody>
          <tr><th scope="row"><label for="a-id">아이디</label></th><td><input type="text" id="a-id" name="id" maxlength="20" autocapitalize="off" spellcheck="false"></td></tr>
          <tr><th scope="row"><label for="a-pw">비밀번호</label></th><td><input type="password" id="a-pw" name="pw" maxlength="30"></td></tr>
          <tr><th scope="row">비밀번호 힌트</th><td><div class="hint" id="a-hint">명월이가 정해 드린 대로</div></td></tr>
        </tbody>
      </table>
      <div class="wh-form__btns"><button type="submit" class="wh-btn">로그인</button></div>
    </form>
    <div id="admin-msg" aria-live="assertive" style="padding:0 12px 12px"></div>
  </section>
  <div class="wh-collect" style="justify-content:center"><md-collect card="X-wolhadang-admin"></md-collect></div>
  <p class="wh-dim" style="text-align:center;margin-top:10px">관리자 외에는 들어갈 수 없습니다. <a href="index.html">처음으로</a></p>
</main>
</td>
</tr>
<tr><td class="wh-foot" id="wh-foot" colspan="2"></td></tr>
</tbody>
</table>
<script type="module">
  import { start } from './wolhadang.js';
  const game = start({ page: 'admin', title: '관리자 로그인 — 월하당' });
  const form = document.getElementById('admin-form');
  const msg = document.getElementById('admin-msg');
  // 제1장에서는 어떤 입력도 통과하지 못한다. 관리자 콘텐츠(장부·문의함·메모)는 제5장에서 봉인과 함께 붙인다(§4.4, §12.12).
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = Date.now();
    game.update('site.wolhadang', (d) => { d.adminTries = (d.adminTries || 0) + 1; d.adminLast = t; });
    msg.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'wh-msg wh-msg--err';
    p.setAttribute('role', 'alert');
    p.textContent = '비밀번호가 맞지 않습니다.';
    msg.append(p);
    form.pw.value = '';
    form.pw.focus();
  });
</script>
</body>
</html>
