<!doctype html>
<html lang="ko">
<head>
<script src="../play-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b100c">
<title>온라인 쌀점 — 월하당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="wolhadang.css">
</head>
<body class="wh">
<!-- 月下堂 홈페이지 · 2025.10 막내 명월 제작 -->
<div id="wh-band" class="wh-band"></div>
<table class="wh-frame" role="presentation">
<colgroup><col class="wh-col-side"><col></colgroup>
<tbody>
<tr><td class="wh-head" id="wh-head" colspan="2"></td></tr>
<tr>
<td class="wh-side" id="wh-side"></td>
<td class="wh-main" id="wh-main">
<main>
  <h1 class="wh-title">온라인 쌀점 <small>월하당 › 온라인 쌀점</small></h1>
  <p>마음속으로 궁금한 것을 하나 떠올리고, 쌀 한 줌을 소반에 흩뿌려 보세요. 소반 위에 떨어진 쌀알을 세어 홀짝을 보고 풀이를 드립니다. <span class="wh-dim">(재미로 보세요 ^^)</span></p>
  <!-- 상중 모드: 쌀점 결과 상문 고정 (9/20 명월) -->
  <div class="wh-rice" data-view="X-wolhadang-rice">
    <div>
      <figure class="wh-rice__board">
        <canvas id="rice-canvas" width="640" height="480" role="img" aria-label="쌀점 소반. 쌀을 던지면 쌀알이 흩어진다."></canvas>
      </figure>
      <div class="wh-rice__ctrl">
        <button type="button" class="wh-btn" id="rice-throw">쌀 한 줌 던지기</button>
        <button type="button" class="wh-btn wh-btn--plain" id="rice-clear">소반 비우기</button>
      </div>
    </div>
    <aside aria-label="쌀점 풀이">
      <div class="wh-rice__result" id="rice-result" aria-live="polite">
        <p class="n">아직 쌀을 던지지 않았습니다.</p>
        <p class="gwae">?</p>
      </div>
      <ol class="wh-rice__log" id="rice-log" aria-label="던진 기록"></ol>
      <div class="wh-collect"><md-collect card="X-wolhadang-rice"></md-collect></div>
    </aside>
  </div>

  <h2 class="wh-sub">쌀점이란?</h2>
  <p>쌀점은 쌀알을 집어 흩거나 상 위에 뿌려, 떨어진 쌀알의 수와 모양으로 길흉을 보는 점입니다. 월하당 온라인 쌀점은 쌀알이 홀(奇)인지 짝(偶)인지를 보고 풀이를 고릅니다.</p>
  <p>쌀알이 소반 테두리에 걸치면 판정이 애매해서 다시 집으셔야 합니다.</p>
</main>
</td>
</tr>
<tr><td class="wh-foot" id="wh-foot" colspan="2"></td></tr>
</tbody>
</table>
<script type="module" src="rice.js"></script>
</body>
</html>
